<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bookkit — بازبینی کتاب اسکن‌شده</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1d222c; --line:#2a3140;
    --ink:#e8ecf3; --dim:#98a2b3; --acc:#5aa9ff; --ok:#3ecf8e; --warn:#f5a524; --bad:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:14px}
  a{color:var(--acc)}
  header{display:flex;gap:14px;align-items:center;padding:10px 16px;background:var(--panel);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
        padding:2px 10px;font-size:12px;color:var(--dim)}
  .chip b{color:var(--ink);font-weight:600}
  .spacer{flex:1}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
         border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit;font-size:13px}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:650}
  main{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;gap:12px;padding:12px;
       align-items:start}
  @media (max-width:1150px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h2{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line);
           color:var(--dim);font-weight:600;display:flex;justify-content:space-between}
  .scroll{max-height:76vh;overflow:auto}
  /* page list */
  .pg{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 12px;
      border-bottom:1px solid #1b2029;cursor:pointer}
  .pg:hover{background:var(--panel2)}
  .pg.active{background:#1b2634;box-shadow:inset 3px 0 0 var(--acc)}
  .pg .n{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:6px}
  .v-clean{background:var(--ok)} .v-review{background:#7fd1a8}
  .v-suspect{background:var(--warn)} .v-broken{background:var(--bad)}
  /* page view */
  .stage{position:relative;background:#0b0d12;padding:10px;overflow:auto;max-height:76vh}
  .stage img{display:block;width:100%;height:auto;border-radius:6px;background:#fff}
  .overlay{position:absolute;inset:10px;pointer-events:none}
  .ov{position:absolute;border:1.5px solid var(--bad);border-radius:3px;pointer-events:auto;
      cursor:pointer}
  .ov:hover{background:rgba(255,107,107,.18)}
  .ov.box{border-color:#39d98a} .ov.bar{border-color:#c77dff}
  .legend{display:flex;gap:12px;padding:6px 12px;border-top:1px solid var(--line);
          font-size:11px;color:var(--dim);flex-wrap:wrap}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px}
  /* flags */
  .flag{border-bottom:1px solid #1b2029;padding:10px 12px}
  .flag .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .code{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:999px;
        background:#2a1f2a;color:#ffb1b1;border:1px solid #43263a}
  .sev{font-size:11px;color:var(--dim)}
  .txt{font-family:var(--mono);font-size:12px;color:#cfd8e6;background:var(--panel2);
       border:1px solid var(--line);border-radius:6px;padding:6px;margin:6px 0;direction:ltr;
       text-align:left;word-break:break-word;max-height:90px;overflow:auto}
  input[type=text]{width:100%;background:#0d1219;border:1px solid var(--line);color:var(--ink);
       border-radius:6px;padding:6px;font-family:var(--mono);font-size:12px;direction:ltr}
  input[type=text]:focus{outline:none;border-color:var(--acc)}
  .row{display:flex;gap:6px;align-items:center;margin-top:6px}
  .crop{border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%;
        cursor:zoom-in;margin-top:6px}
  .muted{color:var(--dim);font-size:12px}
  .item{padding:8px 12px;border-bottom:1px solid #1b2029}
  .item .tag{font-family:var(--mono);font-size:11px;color:var(--acc)}
  .tabs{display:flex;gap:6px;padding:8px 12px 0}
  .tab{flex:1;text-align:center;padding:6px;border-radius:8px;background:var(--panel2);
       border:1px solid var(--line);cursor:pointer;font-size:12px}
  .tab.on{border-color:var(--acc);color:var(--acc)}
  dialog{border:1px solid var(--line);background:#0b0d12;border-radius:12px;max-width:96vw;padding:8px}
  dialog img{max-width:92vw;max-height:82vh;display:block;background:#fff;border-radius:6px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12261c;
         border:1px solid var(--ok);color:#c9f7e0;padding:8px 14px;border-radius:10px;opacity:0;
         transition:.25s;z-index:50}
  .toast.show{opacity:1}
  .progress{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:6px}
  .progress > i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<header>
  <h1 id="title">…</h1>
  <span class="chip">صفحه <b id="npages">–</b></span>
  <span class="chip">امتیاز OCR <b id="score">–</b></span>
  <span class="chip">اصلاح‌شده <b id="nrep">0</b></span>
  <span class="spacer"></span>
  <button onclick="exportAs('book.md')">Markdown</button>
  <button onclick="exportAs('book.json')">JSON</button>
  <button onclick="exportAs('chunks.jsonl')">Chunks</button>
  <button onclick="exportAs('ocr.json')">گزارش OCR</button>
  <button class="primary" onclick="saveAll()">ذخیره در پوشه‌ی خروجی</button>
</header>

<main>
  <section class="card">
    <h2>صفحه‌ها</h2>
    <div class="scroll" id="pages"></div>
  </section>

  <section class="card">
    <h2><span>صفحه <b id="pgno">1</b></span><span class="muted" id="pgmeta"></span></h2>
    <div class="stage" id="stage">
      <img id="pageimg" alt="page raster">
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:#ff6b6b"></i>خطای OCR</span>
      <span><i class="sw" style="background:#39d98a"></i>کادر تشخیص‌داده‌شده</span>
      <span><i class="sw" style="background:#c77dff"></i>نوار پرشده</span>
      <span class="muted">روی کادر بزن تا بزرگ شود</span>
    </div>
  </section>

  <section class="card">
    <div class="tabs">
      <div class="tab on" data-tab="flags" onclick="tab('flags')">خطاها</div>
      <div class="tab" data-tab="text" onclick="tab('text')">متن</div>
      <div class="tab" data-tab="items" onclick="tab('items')">آیتم‌ها</div>
    </div>
    <div class="scroll" id="panel"></div>
  </section>
</main>

<dialog id="zoom"><img id="zoomimg" alt="crop"><div class="row" style="justify-content:center">
  <button onclick="document.getElementById('zoom').close()">بستن</button></div></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const api = (p, opt) => fetch(p, opt).then(r => r.json());
let BOOK = null, PAGE = null, current = 1;

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800); }

async function boot(){
  BOOK = await api('/api/book');
  $('#title').textContent = (BOOK.info.title || BOOK.info.path.split('/').pop());
  $('#npages').textContent = BOOK.info.pages;
  $('#score').textContent = BOOK.ocr.score;
  $('#nrep').textContent = BOOK.repairs;
  const list = $('#pages'); list.innerHTML = '';
  for (let n = 1; n <= BOOK.info.pages; n++){
    const v = BOOK.page_verdicts[n] || {verdict:'unknown', flags:0};
    const row = document.createElement('div');
    row.className = 'pg' + (n === current ? ' active' : '');
    row.dataset.page = n;
    row.innerHTML = `<span class="n"><i class="dot v-${v.verdict}"></i>صفحه ${n}</span>
                     <span class="n">${v.flags ? v.flags + ' خطا' : 'پاک'}</span>`;
    row.onclick = () => loadPage(n);
    list.appendChild(row);
  }
  loadPage(current);
}

async function loadPage(n){
  current = n;
  PAGE = await api('/api/page/' + n);
  document.querySelectorAll('.pg').forEach(el =>
    el.classList.toggle('active', Number(el.dataset.page) === n));
  $('#pgno').textContent = n;
  const px = PAGE.page.raster_px || [];
  $('#pgmeta').textContent = `${PAGE.page.chars} کاراکتر · ${px[0]}×${px[1]}px · ${PAGE.verdict}`;
  const img = $('#pageimg');
  img.src = `/api/page/${n}.png?dpi=150&t=${Date.now()}`;
  img.onload = () => drawOverlay();
  renderFlags(); renderText(); renderItems();
  window.scrollTo({top:0, behavior:'smooth'});
}

function sx(v){ return (v / PAGE.page.width) * 100 + '%'; }
function sy(v){ return (v / PAGE.page.height) * 100 + '%'; }

function drawOverlay(){
  const ov = $('#overlay'); ov.innerHTML = '';
  const add = (b, cls, title, onclick) => {
    const d = document.createElement('div');
    d.className = 'ov ' + cls;
    d.style.left = sx(b[0]); d.style.top = sy(b[1]);
    d.style.width = sx(b[2] - b[0]); d.style.height = sy(b[3] - b[1]);
    d.title = title || '';
    if (onclick) d.onclick = onclick;
    ov.appendChild(d);
  };
  (PAGE.bars||[]).forEach(b => add(b.bbox, 'bar', 'نوار پرشده'));
  (PAGE.boxes||[]).forEach(b => add(b.bbox, 'box', 'کادر: ' + (b.dashed ? 'خط‌چین' : 'یکپارچه')));
  (PAGE.flags||[]).forEach((f, i) => {
    if (!f.bbox) return;
    add(f.bbox, '', `${f.code} — ${f.detail||''}`, () => {
      document.getElementById('f'+i)?.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
}

function renderFlags(){
  const p = $('#panel');
  const flags = PAGE.flags || [];
  if (!flags.length){ p.innerHTML = '<div class="flag muted">خطایی برای این صفحه ثبت نشده ✅</div>'; return; }
  p.innerHTML = '';
  flags.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'flag'; el.id = 'f' + i;
    const crop = f.line !== undefined
      ? `/api/crop/${PAGE.page.number}.png?line=${f.line}&dpi=300&t=${Date.now()}`
      : (f.bbox ? `/api/crop/${PAGE.page.number}.png?bbox=${f.bbox.join(',')}&dpi=300&t=${Date.now()}` : '');
    el.innerHTML = `
      <div class="top"><span class="code">${f.code}</span>
        <span class="sev">شدت ${f.severity} · سطر ${f.line ?? '—'}</span></div>
      <div class="muted">${f.detail || ''}</div>
      <div class="txt">${escapeHtml(f.text || '')}</div>
      ${crop ? `<img class="crop" src="${crop}" loading="lazy"
                     onclick="zoom('${crop}')" alt="crop">` : ''}
      <div class="row">
        <input type="text" placeholder="متن درست بر اساس تصویر…" data-line="${f.line ?? ''}">
        <button class="primary" onclick="fix(this, ${PAGE.page.number}, ${f.line ?? 'null'})">ثبت</button>
      </div>
      ${f.fix_hint ? `<div class="muted" style="margin-top:4px">↳ ${escapeHtml(f.fix_hint)}</div>` : ''}`;
    p.appendChild(el);
  });
}

function renderText(){
  const p = $('#panel');
  const html = (PAGE.paragraphs || []).map(par => {
    const role = {heading:'عنوان', problem:'مسئله', exercise:'تمرین', solution:'حل', label:'برچسب',
                  box:'کادر', body:'متن', noise:'نویز'}[par.role] || par.role;
    return `<div class="item"><span class="tag">${role} · p${par.page}</span>
            <div style="margin-top:4px">${escapeHtml(par.text)}</div></div>`;
  }).join('');
  p.dataset.text = html;
  if ($('.tab.on').dataset.tab === 'text') p.innerHTML = html;
  p.dataset.textHtml = html;
}

function renderItems(){
  const p = $('#panel');
  const html = (PAGE.items || []).map(it => `
     <div class="item"><span class="tag">${it.id}</span>
       ${it.section_number ? `<span class="muted"> §${it.section_number}</span>` : ''}
       ${it.hints && it.hints.length ? `<span class="muted"> · hints ${it.hints.join(', ')}</span>` : ''}
       <div style="margin-top:4px">${escapeHtml(it.text || '')}</div></div>`).join('')
    || '<div class="item muted">آیتمی در این صفحه نیست.</div>';
  p.dataset.itemsHtml = html;
  if ($('.tab.on').dataset.tab === 'items') p.innerHTML = html;
}

function tab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
  const p = $('#panel');
  if (name === 'flags') renderFlags();
  else if (name === 'text') p.innerHTML = p.dataset.textHtml || '';
  else p.innerHTML = p.dataset.itemsHtml || '';
}

async function fix(btn, page, line){
  const input = btn.parentElement.querySelector('input');
  const after = input.value.trim();
  if (!after) { toast('متن درست را بنویس'); return; }
  const res = await fetch('/api/repair', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({page, line, before:'', after})
  }).then(r => r.json());
  if (res.ok){
    $('#nrep').textContent = res.repairs;
    $('#score').textContent = res.ocr.score;
    toast('ثبت شد ✓');
    await loadPage(page);
  } else toast('خطا: ' + (res.error || '?'));
}

async function saveAll(){
  const res = await fetch('/api/rescan', {method:'POST'}).then(r => r.json());
  $('#score').textContent = res.ocr.score;
  toast('مدل بازسازی شد ✓');
  loadPage(current);
}

function exportAs(kind){
  window.open(`/export/${kind}?save=1`, '_blank');
  toast('در پوشه‌ی خروجی ذخیره شد: ' + kind);
}

function zoom(src){
  $('#zoomimg').src = src;
  $('#zoom').showModal();
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'}[c]));
}

boot();
</script>
</body>
</html>
